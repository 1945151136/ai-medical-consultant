version: '3.8'

services:
  # ==========================================
  # MongoDB - 主数据库（业务数据、对话历史）
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: medical-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: medical123
      MONGO_INITDB_DATABASE: medical_platform
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis - 缓存 + 消息队列
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: medical-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO - S3 兼容文件存储
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: medical-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # PaddleOCR Python 微服务
  # ==========================================
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    container_name: medical-ocr
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      LOG_LEVEL: info
      MAX_WORKERS: 2
    volumes:
      - ocr-cache:/root/.paddleocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongo-data:
  redis-data:
  minio-data:
  ocr-cache:
